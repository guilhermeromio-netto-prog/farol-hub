<!doctype html>

  <title>Farol — hub de viagem</title>
  <meta name="description" content="Farol: hub de viagem personalizado com clima, câmbio, feriados, notícias e um planejador de roteiros. Feito por byGui.">
  <meta name="theme-color" content="#070B14">
  <meta name="color-scheme" content="dark">
  <meta name="view-transition" content="same-origin">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">

</head>

  <header class="topo" role="banner">
    <div class="topo__inner">
      <a class="marca" href="#/" aria-label="Farol — página inicial">
        <svg class="marca__icone" aria-hidden="true"><use href="#i-farol"/></svg>
        <span class="marca__nome">Farol</span>
      </a>
      <nav class="nav-desk" aria-label="Navegação principal">
        <a href="#/" data-nav="inicio">Início</a>
        <a href="#/planejar" data-nav="planejar">Planejar</a>
        <a href="#/precos" data-nav="precos">Preços</a>
        <a href="#/cadernos" data-nav="cadernos">Cadernos</a>
        <a href="#/noticias" data-nav="noticias">Notícias</a>
      </nav>
    </div>
  </header>

  <main id="conteudo" class="conteudo" tabindex="-1">
    <div id="vista" class="vista" aria-live="polite" aria-busy="true">
      <div class="shell">
        <div class="sk sk--titulo"></div>
        <div class="sk sk--linha"></div>
        <div class="sk sk--bloco"></div>
      </div>
      <noscript><p class="shell">O Farol precisa de JavaScript ativado para funcionar.</p></noscript>
    </div>
  </main>

  <footer class="rodape" role="contentinfo">
    <div class="rodape__inner">
      <p class="assinatura">Feito por <strong>byGui</strong></p>
      <p class="rodape__nota">Dados ao vivo de fontes públicas. Custos são estimativas, não cotações.</p>
    </div>
  </footer>

  <nav class="nav-mob" aria-label="Navegação principal (celular)">
    <a href="#/" data-nav="inicio"><svg aria-hidden="true"><use href="#i-inicio"/></svg><span>Início</span></a>
    <a href="#/planejar" data-nav="planejar"><svg aria-hidden="true"><use href="#i-planejar"/></svg><span>Planejar</span></a>
    <a href="#/precos" data-nav="precos"><svg aria-hidden="true"><use href="#i-precos"/></svg><span>Preços</span></a>
    <a href="#/cadernos" data-nav="cadernos"><svg aria-hidden="true"><use href="#i-cadernos"/></svg><span>Cadernos</span></a>
    <a href="#/noticias" data-nav="noticias"><svg aria-hidden="true"><use href="#i-noticias"/></svg><span>Notícias</span></a>
  </nav>

  <div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

  <dialog class="dialogo" id="dialogo" aria-labelledby="dialogo-titulo" aria-describedby="dialogo-texto">
    <form method="dialog">
      <h2 id="dialogo-titulo" class="dialogo__titulo">Confirmar</h2>
      <p id="dialogo-texto" class="dialogo__texto"></p>
      <div class="dialogo__acoes">
        <button class="btn btn--fantasma" value="cancelar" type="submit">Cancelar</button>
        <button class="btn btn--perigo" value="ok" type="submit" id="dialogo-ok">Apagar</button>
      </div>
    </form>
  </dialog>
</body>
</html>
